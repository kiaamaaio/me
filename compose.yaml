services:
  # 開発環境
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    # マウントしたソースに生成されるファイルをホストのユーザー所有にする
    # （Dockerfileの USER node と同じ uid/gid。ホスト側が 1000 以外なら合わせて変更する）
    user: "1000:1000"
    ports:
      - "3000:3000"
    volumes:
      # ソースコードをマウント（ライブリロード用）
      - .:/app
      - /app/node_modules
      # .astro はキャッシュとdevサーバーのロック（dev.json）置き場。
      # ホストと共有すると、コンテナ内のPIDを記録したロックが残り、
      # 次回起動時に「別のdevサーバーが動作中」と誤判定されて起動できなくなる
      - /app/.astro
    environment:
      - NODE_ENV=development
    stdin_open: true
    tty: true
